<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--canvas:#F6F7F4;--surface:#fff;--border:#E9EBE5;--text:#1C1E1C;--muted:#727872;--faint:#95998F;--accent:#177566;--accent2:#1B8878;--soft:#EFF8F6;--soft2:#DCF0EB;--deep:#0F4F44;--amber:#B5790A;--amberSoft:#FBEACB;--clay:#C65D4C;--claySoft:#F7DFDA;--violet:#6b5bd2;--chip:#F3F4F0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--canvas);color:var(--text);font-size:14px}
.app{display:flex;width:1440px;height:900px;overflow:hidden}
aside{width:244px;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1B8878,#0F4F44);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{font-size:15px;display:flex;align-items:center;gap:6px}.brand small{display:block;color:var(--faint);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.v2{font-size:10px;font-weight:700;color:var(--accent);background:var(--soft2);border-radius:5px;padding:1px 5px}
.logbtn{background:var(--accent);color:#fff;border-radius:10px;padding:11px 14px;font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,79,68,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.logbtn .k{margin-left:auto;font-size:11px;opacity:.75;border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:0 5px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#565B56;font-weight:500}
.nav.on{background:var(--soft);color:var(--deep);font-weight:600}
.nav svg{width:17px;height:17px;flex-shrink:0}
.grp{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding:16px 10px 6px;display:flex;justify-content:space-between}
.sub{padding:7px 10px 7px 37px;color:#565B56;font-size:13px;border-radius:8px;position:relative}
.sub.on{background:var(--soft);color:var(--deep);font-weight:600}
.sub.on:before{content:"";position:absolute;left:18px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.me{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;display:flex;gap:10px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;background:#D2920F;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.me small{display:block;color:var(--muted);font-size:12px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:60px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 28px;flex-shrink:0}
.crumb{color:var(--muted);margin-right:14px}.crumb b{color:var(--text)}
.pill{border:1px solid var(--border);border-radius:8px;padding:7px 12px;background:var(--surface);display:inline-flex;gap:8px;align-items:center;font-weight:500;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent2)}
.search{margin-left:auto;width:250px;color:var(--faint)}
.bell{width:36px;height:36px;border:1px solid var(--border);border-radius:8px;display:grid;place-items:center;position:relative}
.bell i{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--clay)}
.page{padding:24px 28px;overflow:hidden;flex:1;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-size:22px;font-weight:650;letter-spacing:-.015em}
.subt{color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.tab{padding:9px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--deep);border-color:var(--accent);font-weight:600}
.btn{background:var(--accent);color:#fff;border-radius:9px;padding:9px 16px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.card.p0{padding:0;overflow:hidden}
.h3{font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.h3 em{font-style:normal;color:var(--muted);font-weight:500;font-size:12px}
.grid{display:grid;gap:16px}
.kpi small{color:var(--muted);font-weight:500;font-size:13px}.kpi b{font-size:26px;display:block;margin:6px 0 2px;letter-spacing:-.02em}
.up{color:var(--accent2);font-size:12px;font-weight:600}.down{color:var(--clay);font-size:12px;font-weight:600}.mut{color:var(--muted);font-size:12px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft2);color:var(--deep);white-space:nowrap}
.badge.w{background:var(--amberSoft);color:var(--amber)}.badge.g{background:var(--chip);color:#565B56}.badge.r{background:var(--claySoft);color:#B14B3C}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:11px 16px;background:#FAFBF8;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ico{width:34px;height:34px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.hero{background:linear-gradient(120deg,#0F4F44,#177566);color:#fff;border-radius:16px;padding:24px;display:flex;justify-content:space-between;align-items:center}
.hero small{color:#9fd3c7;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.hero .big{font-size:30px;font-weight:700;margin:6px 0;letter-spacing:-.02em}
.hero .tags{display:flex;gap:8px;margin-top:12px}
.hero .tags span{background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:500}
.herobtn{background:#fff;color:var(--deep);font-weight:700;padding:12px 20px;border-radius:10px}
.heat{display:grid;grid-template-columns:repeat(30,1fr);gap:4px;margin-top:14px}
.heat span{aspect-ratio:1;border-radius:3px}
.field label{display:block;font-size:13px;font-weight:600;color:#3D413D;margin-bottom:6px}
.inp{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface);display:flex;justify-content:space-between;color:var(--text)}
.inp.ph2{color:var(--faint)}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg span{padding:7px 14px;border-radius:8px;font-weight:500;color:var(--muted);font-size:13px}
.seg span.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.choice{border:1.5px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex:1}
.choice.on{border-color:var(--accent);background:var(--soft)}
.choice .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);margin-left:auto}
.choice.on .r{border:5px solid var(--accent)}
.counter{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.counter span{width:38px;height:36px;display:grid;place-items:center;font-size:18px;color:var(--muted);background:#FAFBF8}
.counter b{width:48px;text-align:center;font-size:16px}
.prodrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.prodrow:first-child{border-top:0}
.sticky{background:var(--surface);border-top:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:20px;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tl{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--border)}.tl:first-child{border-top:0}
.tl .dot2{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex-shrink:0}
/* phone */
.phones{display:flex;gap:40px;padding:40px;width:1440px;height:900px;background:var(--canvas);justify-content:center;align-items:center}
.phone{width:375px;height:800px;background:var(--canvas);border-radius:44px;border:10px solid #1C1E1C;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.ptop{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;margin-top:24px}
.pbody{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.tabbar{height:74px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding-bottom:12px}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
.tabbar div.on{color:var(--deep);font-weight:600}
.tabbar .plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:#fff;font-size:26px;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(23,117,102,.4)}
.caption{width:300px}
.caption h2{font-size:26px;letter-spacing:-.02em;margin-bottom:10px}
.caption p{color:var(--muted);line-height:1.55;margin-bottom:10px}
</style></head>
<body><div id="root"></div>
<script>
const I={
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
hist:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
grow:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'};
const svg=(k,s=17)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};

const growthSubs=[['overview','Overview'],['input','Weekly input'],['monthly','Monthly summary'],['compare','Compare platforms'],['impact','Content impact'],['reports','Reports'],['activity','Activity log']];
function shell(active,crumb,body,{sticky='',filters=true}={}){
 const n=(k,ic,l)=>`<div class="nav ${active===k?'on':''}">${svg(ic)}${l}</div>`;
 const inGrowth=growthSubs.some(g=>g[0]===active);
 return `<div class="app"><aside>
 <div class="brand"><div class="logo">P</div><div><b>Partnerlee <span class="v2">2.0</span></b><small>Content Tracker</small></div></div>
 <div class="logbtn">＋ Log today's work <span class="k">N</span></div>
 ${n('home','home','Home')}${n('history','hist','History')}
 <div class="grp">Growth <span>▾</span></div>
 ${growthSubs.map(([k,l])=>`<div class="sub ${active===k?'on':''}">${l}</div>`).join('')}
 <div style="height:10px"></div>${n('settings','set','Settings')}
 <div class="me"><div class="av" style="background:#1B8878">AM</div><div><b>Ana Mendoza</b><small>Content Assistant</small></div></div>
 </aside><main>
 <div class="top"><span class="crumb">${crumb}</span>
 ${filters?`<span class="pill"><span class="dot"></span>Acme Coffee ▾</span><span class="pill">📅 This week ▾</span>`:''}
 <span class="pill search">🔍 Search pages, clients… <span style="margin-left:auto">⌘K</span></span>
 <div class="bell">${svg('bell')}<i></i></div></div>
 <div class="page">${body}</div>${sticky}</main></div>`}

const spark=(pts,c='#1B8878')=>`<svg viewBox="0 0 100 28" style="height:28px;width:100%;margin-top:8px"><polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map((v,i)=>`${i*100/(pts.length-1)},${28-v}`).join(' ')}"/></svg>`;
const kpi=(l,v,d,up=true,pts)=>`<div class="card kpi"><small>${l}</small><b>${v}</b><span class="${up?'up':'down'}">${d}</span>${pts?spark(pts,up?'#1B8878':'#C65D4C'):''}</div>`;
function lineChart(w,h,series,labels){let s=`<svg viewBox="0 0 ${w} ${h+24}" width="100%" style="display:block">`;
 for(let g=0;g<=4;g++){const y=10+g*(h-10)/4;s+=`<line x1="34" x2="${w}" y1="${y}" y2="${y}" stroke="#EDEFEA"/><text x="0" y="${y+4}" font-size="11" fill="#95998F">${(4-g)*50}k</text>`}
 series.forEach(([c,data,fill])=>{const pts=data.map((v,i)=>[34+i*(w-50)/(data.length-1),10+(h-10)*(1-v)]);
  if(fill)s+=`<path d="M${pts.map(p=>p.join(',')).join(' L')} L${w-16},${h} L34,${h}Z" fill="${c}" opacity=".10"/>`;
  s+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach((p,i)=>{if(i===pts.length-1)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="${c}" stroke-width="2.5"/>`})});
 labels.forEach((l,i)=>s+=`<text x="${34+i*(w-50)/(labels.length-1)}" y="${h+18}" font-size="11" fill="#95998F" text-anchor="middle">${l}</text>`);
 return s+'</svg>'}
function barChart(w,h,groups,colors,labels){let s=`<svg viewBox="0 0 ${w} ${h+24}" width="100%" style="display:block">`;
 for(let g=0;g<=4;g++){const y=g*h/4;s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#EDEFEA"/>`}
 const gw=w/groups.length;groups.forEach((vals,i)=>{const bw=Math.min(18,(gw-14)/vals.length);vals.forEach((v,j)=>{const x=i*gw+(gw-bw*vals.length-3*(vals.length-1))/2+j*(bw+3);s+=`<rect x="${x}" y="${h-v*h}" width="${bw}" height="${v*h}" rx="4" fill="${colors[j]}"/>`});
 s+=`<text x="${i*gw+gw/2}" y="${h+18}" font-size="11" fill="#95998F" text-anchor="middle">${labels[i]}</text>`});return s+'</svg>'}
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const S={};
S.home=()=>shell('home','Workspace / <b>Home</b>',`
<div class="ph"><div><h1>Good morning, Ana 👋</h1><div class="subt">Wednesday, November 25, 2026 · You're assigned to 3 clients</div></div></div>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:18px">
 <div style="display:flex;flex-direction:column;gap:18px">
  <div class="hero"><div><small>Today</small><div class="big">5 items logged</div><div style="opacity:.85">2 tasks still in progress for Acme Coffee</div>
   <div class="tags"><span>🎬 3 videos</span><span>🖼 2 carousels</span><span>✍️ 0 text posts</span></div></div>
   <div style="display:flex;align-items:center;gap:26px"><div style="text-align:center"><b style="font-size:34px;display:block">🔥 12</b><span style="opacity:.8">day streak</span></div><div class="herobtn">Continue log →</div></div></div>
  <div class="grid" style="grid-template-columns:repeat(4,1fr)">
   ${kpi('Videos edited','48','▲ 12% vs last week',true,[6,10,8,16,14,20,24])}
   ${kpi('Carousels','21','▲ 4% vs last week',true,[10,8,14,12,18,16,19])}
   ${kpi('Text posts','14','▼ 6% vs last week',false,[20,18,19,14,16,10,8])}
   ${kpi('Re-edits','9','▼ 3 fewer — nice',true,[22,19,16,18,12,10,6])}
  </div>
  <div class="card"><div class="h3">Your activity <em>Less <span style="display:inline-flex;gap:3px;vertical-align:-2px">${[0,1,2,3].map(i=>`<i style="width:10px;height:10px;border-radius:2px;background:var(--h${i})"></i>`).join('')}</span> More</em></div><div class="heat" id="heat"></div></div>
 </div>
 <div style="display:flex;flex-direction:column;gap:18px">
  <div class="card"><div class="h3">This week's goal <em>32 / 40 items</em></div><div class="bar" style="margin:14px 0 8px;height:10px"><i style="width:80%"></i></div><div class="mut">8 more to hit your weekly target · 2 days left</div></div>
  <div class="card"><div class="h3">My clients <em>This week</em></div><div style="margin-top:6px">
   ${[['Acme Coffee','#1B8878',18,'Done'],['Northwind','#6b5bd2',9,'In progress'],['Bloom Studio','#C65D4C',5,'Done']].map(([n,c,v,s])=>`<div class="row"><div class="ico" style="background:${c}22;color:${c};font-weight:700">${n[0]}</div><div style="flex:1"><b>${n}</b><div class="bar" style="margin-top:6px"><i style="width:${v*5}%;background:${c}"></i></div></div><b>${v}</b></div>`).join('')}</div></div>
  <div class="card"><div class="h3">Recent logs <em>View all →</em></div><div style="margin-top:6px">
   ${[['🎬','Acme Coffee','3 videos · today','Done',''],['🖼','Northwind','2 carousels · today','In progress','w'],['✍️','Bloom Studio','4 text posts · yesterday','Done',''],['🧩','Other work','Team meeting · Mon','Other','g']].map(([i,n,d,b,c])=>`<div class="row"><div class="ico">${i}</div><div style="flex:1"><b>${n}</b><div class="mut">${d}</div></div><span class="badge ${c}">${b}</span></div>`).join('')}</div></div>
 </div></div>`);

S.log=()=>shell('log','Workspace / <b>Log today\'s work</b>',`
<div class="ph"><div><h1>Log today's work</h1><div class="subt">Wednesday, November 25 · auto-saved as draft 2 min ago</div></div><div class="seg"><span class="on">Today</span><span>Yesterday</span><span>Pick date…</span></div></div>
<div style="display:grid;grid-template-columns:1.7fr 1fr;gap:18px">
 <div style="display:flex;flex-direction:column;gap:16px">
  <div class="card"><div class="h3" style="margin-bottom:12px">What kind of day was this?</div>
   <div style="display:flex;gap:12px"><div class="choice on"><div class="ico" style="background:#fff">🎬</div><div><b>Client production</b><div class="mut">Videos, carousels, text posts</div></div><div class="r"></div></div>
   <div class="choice"><div class="ico">🧩</div><div><b>Other work</b><div class="mut">Meetings, admin, research</div></div><div class="r"></div></div></div>
   <div class="field" style="margin-top:16px"><label>Client</label><div style="display:flex;gap:8px">${['Acme Coffee','Northwind','Bloom Studio','+ Other'].map((c,i)=>`<span class="pill" style="${i===0?'border-color:var(--accent);background:var(--soft);color:var(--deep);font-weight:600':''}">${i<3?`<span class="dot" style="background:${['#1B8878','#6b5bd2','#C65D4C'][i]}"></span>`:''}${c}</span>`).join('')}</div></div>
  </div>
  <div class="card"><div class="h3">Production <em>Tap + / – to count · set status per item</em></div><div style="margin-top:6px">
   ${[['🎬','Videos edited',3,1],['🔁','Videos re-edited',1,0],['🖼','Carousels edited',2,1],['🔁','Carousels re-edited',0,0],['✍️','Text posts prepared',0,0],['🔁','Text posts re-edited',0,0]].map(([i,l,v,s])=>`<div class="prodrow"><div class="ico">${i}</div><div><b style="${v?'':'color:var(--muted);font-weight:500'}">${l}</b></div>
   <div class="seg" style="${v?'':'opacity:.4'}"><span class="${s?'on':''}">✓ Completed</span><span class="${v&&!s?'on':''}">⏳ In progress</span></div>
